<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/info.css">
</head>
<body class="bg-light">
  <div class="container ">
    <div class="profile-container">
      <h3 class="text-center mb-4">User Profile</h3>

      <form id="userForm">
        <div class="mb-3">
          <label for="nom" class="form-label">Nom</label>
          <input type="text" class="form-control" id="nom" disabled>
        </div>
        <div class="mb-3">
          <label for="prenom" class="form-label">Prénom</label>
          <input type="text" class="form-control" id="prenom" disabled>
        </div>
        <div class="mb-3">
          <label for="name" class="form-label">Username</label>
          <input type="text" class="form-control" id="name" disabled>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" disabled>
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">Phone</label>
          <input type="text" class="form-control" id="phone" disabled>
        </div>

        <div class="d-flex justify-content-between">
          <button type="button" class="btn btn-outline-primary" id="editBtn">Edit</button>
          <button type="submit" class="btn btn-success d-none" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/userinfo.js"></script>
</body>
</html>
